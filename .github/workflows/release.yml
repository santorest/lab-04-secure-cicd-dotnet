name: Release

# On every push to main: publish the image to GHCR, attach SBOMs, sign it and record build provenance,
# then verify the signature and provenance the same way anyone else would.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/santorest/lab-04-secure-cicd-dotnet

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Pushed $IMAGE@$digest"

      - name: SBOM of the NuGet dependencies (CycloneDX)
        run: |
          dotnet tool restore
          dotnet tool run dotnet-CycloneDX src/TicketApi/TicketApi.csproj --output sbom --filename nuget.cdx.json --output-format Json
      - name: SBOM of the image (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom/image.cdx.json
          exit-code: "0"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the image and attach the SBOM (keyless, GitHub OIDC)
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom/image.cdx.json "$IMAGE@$DIGEST"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Verify signature and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github.com/santorest/lab-04-secure-cicd-dotnet/.github/workflows/release.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > cosign-verify.json
          jq -r '.[0].optional.Subject, .[0].optional.githubWorkflowRef // empty' cosign-verify.json
          gh attestation verify "oci://$IMAGE@$DIGEST" --owner santorest
          echo "### Released $IMAGE@$DIGEST (signed, SBOM attached, provenance verified)" >> "$GITHUB_STEP_SUMMARY"
