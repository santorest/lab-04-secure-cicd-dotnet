name: CI

# Pull-request gates. Every job is a required status check on main (see .github/rulesets/main.json).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build --logger "trx;LogFileName=results.trx"

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # NuGet audit runs during restore; High/Critical advisories (NU1903/NU1904) are errors (Directory.Build.props).
      - name: Restore with NuGet audit (gate)
        run: dotnet restore
      - name: Vulnerable package report
        if: always()
        run: dotnet list package --vulnerable --include-transitive --format json > vulnerable-packages.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vulnerable-packages
          path: vulnerable-packages.json

  sast:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep scan --metrics=off --config p/csharp --config p/secrets \
            --sarif-output=semgrep.sarif --json-output=semgrep.json
      - name: "Gate: no ERROR-severity findings"
        run: |
          jq -r '.results[] | "\(.extra.severity)\t\(.check_id)\t\(.path):\(.start.line)"' semgrep.json
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          echo "ERROR findings: $errors"
          test "$errors" -eq 0
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Full history of the commit under test, with the pinned official image. --log-opts=HEAD keeps other
      # branches out of the scan: fetch-depth 0 fetches every branch, and without it a leak on one branch
      # (e.g. a demo PR) failed every other PR.
      - name: gitleaks (full history of this commit)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts=HEAD --redact --verbose --exit-code 1

  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image, pinned by digest (the checkov-action release pulls a much older Checkov).
      - name: Checkov (Dockerfile, GitHub Actions)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          bridgecrew/checkov:3.3.20@sha256:6d20ebbcde58b2dce6e3151a6771fefa4d468281fe442475455623f5799b9f53
          --directory . --framework dockerfile github_actions --quiet --compact
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: zizmor (workflow security)
        run: pipx run zizmor==1.30.1 --offline --min-severity medium .github/workflows

  container:
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t ticketapi:ci .
      - name: Smoke test (read-only root filesystem, only /data writable)
        run: |
          docker run -d --name api --read-only --tmpfs /tmp -v apidata:/data -p 8080:8080 \
            -e Jwt__SigningKey="$(openssl rand -base64 32)" ticketapi:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/health
          headers=$(curl -sSI http://localhost:8080/health)
          echo "$headers"
          if echo "$headers" | grep -qi '^server:'; then echo "Server header must not be sent"; exit 1; fi
          echo "$headers" | grep -qi "^content-security-policy: default-src 'none'"
      - name: Show logs on failure
        if: failure()
        run: docker logs api || true
      - name: "Trivy (gate: fixable High/Critical)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ticketapi:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Trivy (SARIF for code scanning, all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ticketapi:ci
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          trivyignores: .trivyignore.yaml
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Save image for the DAST job
        run: docker save ticketapi:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: image.tar.gz
          retention-days: 3

  dast:
    needs: container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      - name: Start the API with throw-away credentials
        run: |
          key=$(openssl rand -base64 32)
          password="Zap-$(openssl rand -hex 16)-A1!"
          echo "::add-mask::$key"
          echo "::add-mask::$password"
          docker network create zapnet
          docker run -d --name api --network zapnet --read-only --tmpfs /tmp -v apidata:/data -p 8080:8080 \
            -e Jwt__SigningKey="$key" -e Seed__Enabled=true \
            -e Seed__Users__0__UserName=zap-agent -e Seed__Users__0__Password="$password" -e Seed__Users__0__Role=agent \
            ticketapi:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          token=$(curl -fsS -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d "{\"userName\":\"zap-agent\",\"password\":\"$password\"}" | jq -r .accessToken)
          echo "::add-mask::$token"
          echo "ZAP_TOKEN=$token" >> "$GITHUB_ENV"
      - name: ZAP API scan (authenticated, OpenAPI-driven)
        run: |
          mkdir -p zap && cp security/zap-rules.tsv zap/ && chmod -R a+rwX zap
          set +e
          docker run --rm --network zapnet -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Authorization -e ZAP_AUTH_HEADER_VALUE="Bearer $ZAP_TOKEN" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-api-scan.py -t http://api:8080/openapi/v1.json -f openapi -c zap-rules.tsv \
            -r zap.html -J zap.json -I
          rc=$?
          set -e
          echo "zap-api-scan exit code: $rc (0 ok, 1 a FAIL rule matched, 3 scan error)"
          highs=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' zap/zap.json)
          jq -r '.site[].alerts[] | "\(.riskdesc)\t\(.pluginid)\t\(.name)"' zap/zap.json
          echo "High alerts: $highs"
          test "$rc" -eq 0 && test "$highs" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-report
          path: zap/zap.*
      - name: API logs
        if: always()
        run: docker logs api || true
